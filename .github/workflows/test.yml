name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  emacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Emacs
        run: sudo apt-get update && sudo apt-get install -y emacs-nox
      - name: Fetch pinned test libraries
        run: ./scripts/fetch-test-deps --activities
      - name: Check package and behavior
        run: ./scripts/test
      - name: Check Activities restoration
        run: ./scripts/test-activities
